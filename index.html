  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: "Stag Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; padding: 76px 16px 40px; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--accent); opacity: .07; -webkit-mask: var(--hatter) 0 0 / 240px 240px; mask: var(--hatter) 0 0 / 240px 240px; }
  button, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Csapat-logók */
  .on-logos { position: fixed; top: 14px; left: 16px; z-index: 50; display: flex; gap: 8px; }
  .on-logos a { display: inline-flex; width: 42px; height: 42px; border-radius: 50%; align-items: center; justify-content: center; background: #eaf3ff; transition: transform .18s ease, box-shadow .2s ease; }
  .on-logos a:hover { transform: scale(1.1); }
  .on-logos a.on { box-shadow: 0 0 0 3px var(--accent); }
  .on-logos .lg-k { display: block; width: 32px; height: 32px; background: #003366; -webkit-mask: url(ikon/csikos-96.png) center/contain no-repeat; mask: url(ikon/csikos-96.png) center/contain no-repeat; }
  .on-logos .lg-v { display: block; width: 28px; height: 28px; background: #0f7a45; -webkit-mask: url(ikon/villam-96.png) center/contain no-repeat; mask: url(ikon/villam-96.png) center/contain no-repeat; }
  .on-logos img { width: 32px; height: 32px; display: block; }

  /* Belépés */
  html.lock body > *:not(#gate):not(.on-logos) { visibility: hidden !important; }
  html.lock .on-logos { z-index: 10000; }
  html.lock body { overflow: hidden; }
  #gate { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); visibility: visible; }
  #gate::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--accent); opacity: .07; -webkit-mask: var(--hatter) 0 0 / 240px 240px; mask: var(--hatter) 0 0 / 240px 240px; }
  #gate form { position: relative; width: 100%; max-width: 380px; background: var(--card); border: 3px solid var(--accent); border-radius: 24px; padding: 32px 26px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .bolt { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .bolt span { width: 46px; height: 46px; background: linear-gradient(160deg, var(--blue), var(--accent)); -webkit-mask: url(ikon/villam-96.png) center/contain no-repeat; mask: url(ikon/villam-96.png) center/contain no-repeat; }
  #gate h1 { font-size: 2rem; letter-spacing: -.03em; margin: 0 0 6px; }
  #gate p { color: var(--muted); margin: 0 0 20px; }
  #gate input { width: 100%; font: inherit; font-size: 1.1rem; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
  #gate input:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; cursor: pointer; font-weight: 700; background: var(--accent); color: var(--bg); padding: 14px 18px; }
  .btn[disabled] { opacity: .6; cursor: wait; }
  #gate .btn { width: 100%; margin-top: 12px; font-size: 1.05rem; }
  #gate .err { color: var(--warn); min-height: 1.4em; margin: 12px 0 0; font-size: .95rem; }

  /* Fejléc */
  .wrap { max-width: 1180px; margin: 0 auto; }
  header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; margin-bottom: 22px; }
  .eyebrow { color: var(--accent); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .8rem; margin: 0 0 4px; }
  h1.title { font-size: clamp(1.9rem, 5vw, 2.8rem); letter-spacing: -.03em; line-height: 1.05; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .tabs { display: inline-flex; background: var(--card); border-radius: 999px; padding: 4px; gap: 2px; }
  .tabs button { border: 0; background: transparent; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--bg); }
  select.q { background: var(--card); border: 0; border-radius: 999px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
  .kilep { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .kilep:hover { color: var(--ink); border-color: var(--muted); }
  a.kilep { text-decoration: none; display: inline-flex; align-items: center; }
  a.kilep.szb { color: var(--accent); border-color: var(--accent); }
  .status { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .85rem; margin: -8px 0 20px; flex-wrap: wrap; }
  .status button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; color: var(--muted); }
  .status button:hover { color: var(--ink); border-color: var(--muted); }
  .legend { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 2px; height: 12px; background: var(--ink); }
  .legend i.v { background: var(--warn); }

  /* Kártyák */
  .card { background: var(--card); border-radius: 20px; padding: 20px 22px; box-shadow: 0 8px 28px rgba(0,0,0,.22); }
  .grid { display: grid; gap: 16px; }
  .kpis { grid-template-columns: 1.4fr 1fr 1fr; margin-bottom: 16px; }
  .k-label { color: var(--muted); font-size: .8rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; margin: 0 0 8px; }
  .k-num { font-size: clamp(2.2rem, 6vw, 3.4rem); font-weight: 700; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; }
  .k-num small { font-size: .4em; color: var(--muted); font-weight: 600; letter-spacing: 0; margin-left: 4px; }
  .k-sub { color: var(--muted); margin: 6px 0 14px; font-size: .95rem; }
  .k-sub b { color: var(--ink); }
  .pct { font-weight: 700; font-variant-numeric: tabular-nums; }
  .pct.ok { color: var(--accent); }

  .bar { position: relative; height: 12px; background: var(--track); border-radius: 999px; }
  .bar.big { height: 18px; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--blue); width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .bar .fill.ok { background: var(--accent); }
  .bar .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 2px; transform: translateX(-1px); }
  .bar .tick.v { background: var(--warn); }
  .bar .tick-l { position: absolute; top: calc(100% + 4px); transform: translateX(-50%); font-size: .7rem; color: var(--warn); white-space: nowrap; }
  .bar-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: .85rem; color: var(--muted); }

  .weeks { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 6px; align-items: end; height: 64px; margin-top: 22px; }
  .weeks div { position: relative; background: var(--blue); border-radius: 6px 6px 2px 2px; min-height: 3px; opacity: .85; }
  .weeks div.zero { background: var(--track); opacity: 1; }
  .weeks span { position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); font-size: .7rem; color: var(--muted); white-space: nowrap; }
  .weeks-l { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 6px; font-size: .7rem; color: var(--muted); text-align: center; margin-top: 4px; }

  /* Rekord */
  .rekord { margin-bottom: 16px; border: 2px solid var(--accent); background: linear-gradient(135deg, var(--card2), var(--card)); }
  .rekord .r-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
  .rekord .r-num { font-size: clamp(2.6rem, 9vw, 4.6rem); font-weight: 700; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .rekord .r-num small { font-size: .35em; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .kpis2 { grid-template-columns: 1fr 1fr; margin-bottom: 16px; }
  .q-sor { display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; align-items: center; margin: 10px 0; font-size: .85rem; color: var(--muted); }
  .q-sor > span:last-child { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .team-h > span { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  table.hb { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .9rem; }
  table.hb th, table.hb td { text-align: right; padding: 7px 4px; border-bottom: 1px solid var(--line); }
  table.hb thead th { color: var(--muted); font-size: .75rem; font-weight: 600; }
  table.hb tbody th { text-align: left; font-weight: 600; }
  table.hb tr:last-child th, table.hb tr:last-child td { border-bottom: 0; }
  table.hb td span { color: var(--muted); font-size: .78rem; display: block; }
  .r-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 30px; }
  .bar .tick.j { background: #ffd34d; width: 3px; }

  .members li:last-child { border-bottom: 0; }

<script>
/* Belépés.
   - Ha az API (Apps Script) be van állítva, a jelszót az ellenőrzi, és tokent ad.
   - Ha nincs, az adatok az adat.enc.json fájlban vannak, a jelszóval titkosítva: a jelszóból képzett
     kulccsal az oldal visszafejti őket. A böngésző a kulcsot tárolja, a jelszót nem. */
(function () {
  var K = "fbr_token", root = document.documentElement;
  var tok = "";
  try { tok = localStorage.getItem(K) || ""; } catch (e) {}
  window.FBR = {
    token: function () { return tok; },
    lock: function () { try { localStorage.removeItem(K); } catch (e) {} tok = ""; root.classList.add("lock"); build(); }
  };
  if (!tok) root.classList.add("lock");
  function helyi(jelszo) {
    return fetch("adat.enc.json?_=" + Date.now()).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (f) {
      return new Promise(function (ok) { setTimeout(ok, 30); }).then(function () { // hadd rajzolja ki az „Ellenőrzés…” feliratot
        var kulcs = FbrKripto.kulcs(jelszo, f);
        return FbrKripto.visszafejt(kulcs, f) ? { ok: true, token: kulcs } : { ok: false };
      });
    });
  }
  function build() {
    if (document.getElementById("gate")) return;
    if (!document.body) { document.addEventListener("DOMContentLoaded", build); return; }
    var g = document.createElement("div"); g.id = "gate";
    g.innerHTML = '<form autocomplete="on"><div class="bolt" aria-hidden="true"><span></span></div><h1>Felber csapat</h1><p>Add meg a jelszót a belépéshez.</p>' +
      '<input type="password" id="fbr-pw" placeholder="Jelszó" aria-label="Jelszó" autocomplete="current-password">' +
      '<button class="btn" type="submit">Belépés</button><p class="err" role="alert"></p></form>';
    document.body.appendChild(g);
    var f = g.querySelector("form"), pw = g.querySelector("input"), btn = g.querySelector("button"), er = g.querySelector(".err");
    setTimeout(function () { pw.focus(); }, 50);
    f.addEventListener("submit", function (ev) {
      ev.preventDefault(); if (!pw.value) return;
      btn.disabled = true; er.textContent = ""; btn.textContent = "Ellenőrzés…";
      (API ? fetch(API + "?login=" + encodeURIComponent(pw.value) + "&_=" + Date.now()).then(function (r) { return r.json(); }) : helyi(pw.value))
        .then(function (d) {
          if (d && d.ok && d.token) { try { localStorage.setItem(K, d.token); } catch (e) {} location.reload(); }
          else { er.textContent = d && d.error === "setup" ? "A jelszó még nincs beállítva az Apps Scriptben." : "Hibás jelszó."; btn.disabled = false; btn.textContent = "Belépés"; pw.select(); }
        })
        .catch(function () { er.textContent = "Nem sikerült csatlakozni, próbáld újra."; btn.disabled = false; btn.textContent = "Belépés"; });
    });
  }
  if (!tok) build();
})();
</script>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Felber BL</p>
      <h1 class="title">Eredményjelző</h1>
    </div>
    <div class="controls"><div class="controls" id="controls"></div><a class="kilep szb" href="szb.html">Kontroll SZB</a><button class="kilep" id="kilep" type="button">Kilépés</button></div>
  </header>

<script>
(function () {
  var HONAPOK = ["január", "február", "március", "április", "május", "június", "július", "augusztus", "szeptember", "október", "november", "december"];
  var ROVID = { jan: 0, febr: 1, feb: 1, "márc": 2, marc: 2, "ápr": 3, apr: 3, "máj": 4, maj: 4, "jún": 5, jun: 5, "júl": 6, jul: 6, aug: 7, szept: 8, szep: 8, okt: 9, nov: 10, dec: 11 };
  var NAP = 864e5;
  var app = document.getElementById("app"), controls = document.getElementById("controls");
  var S = { data: null, lap: "", honap: -1, betolt: false, idozito: null, nezet: "" };
  try { S.nezet = localStorage.getItem("fbr_nezet") || ""; } catch (e) {}

  /* ---------- segédek ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function szam(n) { return n == null ? "–" : Math.round(n).toLocaleString("hu-HU"); }
  function arany(a, b) { return a != null && b ? a / b : null; }
  function szazalek(p) { return p == null ? "–" : Math.round(p * 100) + "%"; }
  function pctHtml(p) { return '<span class="pct' + (p != null && p >= 1 ? " ok" : "") + '">' + szazalek(p) + "</span>"; }
  function clamp(x) { return Math.max(0, Math.min(1, x)); }

  function honapIndex(nev) { return HONAPOK.indexOf(String(nev || "").trim().toLowerCase()); }
  function ev() { var m = /^(\d{4})/.exec(S.lap || ""); return m ? +m[1] : new Date().getFullYear(); }

  /** A hónapból eltelt idő aránya (0–1), vagy null, ha nem ismert. */
  function idoArany(honapNev) {
    var h = honapIndex(honapNev); if (h < 0) return null;
    var tol = new Date(ev(), h, 1), ig = new Date(ev(), h + 1, 1), most = Date.now();
    return clamp((most - tol) / (ig - tol));
  }

  /** „Rekordcél (nov. 1 – dec. 20.)” → {tol, ig} dátumok */
  function rekordIdo(cimke) {
    var m = /\(\s*([a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ]+)\.?\s*(\d{1,2})\.?\s*[–—-]\s*([a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ]+)\.?\s*(\d{1,2})/.exec(cimke || "");
    if (!m) return null;
    var h1 = ROVID[m[1].toLowerCase()], h2 = ROVID[m[3].toLowerCase()];
    if (h1 == null || h2 == null) return null;
    var y = ev(), tol = new Date(y, h1, +m[2]), ig = new Date(h2 < h1 ? y + 1 : y, h2, +m[4] + 1); // ig: a zárónap vége
    return { tol: tol, ig: ig, szoveg: m[1].toLowerCase() + ". " + m[2] + ". – " + m[3].toLowerCase() + ". " + m[4] + "." };
  }

  function bar(ertek, cel, o) {
    o = o || {};
    var p = arany(ertek, cel), w = p == null ? 0 : clamp(p) * 100;
    var h = '<div class="bar' + (o.big ? " big" : "") + '" role="img" aria-label="' + esc(szam(ertek) + " / " + szam(cel) + " (" + szazalek(p) + ")") + '">' +
      '<div class="fill' + (p != null && p >= 1 ? " ok" : "") + '" data-w="' + w.toFixed(1) + '"></div>';
    if (o.vallalas && cel && o.vallalas !== cel) {
      var v = clamp(o.vallalas / cel) * 100;
      h += '<div class="tick v" style="left:' + v.toFixed(1) + '%" title="Vállalás: ' + szam(o.vallalas) + '"></div>';
      if (o.vCimke) h += '<div class="tick-l" style="left:' + v.toFixed(1) + '%">vállalás ' + szam(o.vallalas) + "</div>";
    }
    (o.jelek || []).forEach(function (j) {
      if (!cel || j.ertek >= cel) return;
      var x = (clamp(j.ertek / cel) * 100).toFixed(1), ok = ertek != null && ertek >= j.ertek ? " ok" : "";
      h += '<div class="tick j' + ok + '" style="left:' + x + '%"></div><div class="tick-l j' + ok + '" style="left:' + x + '%">' + szam(j.ertek) + "</div>";
    });
    if (o.ido != null && o.ido > 0 && o.ido < 1) h += '<div class="tick" style="left:' + (o.ido * 100).toFixed(1) + '%" title="Időarányos: ' + szazalek(o.ido) + '"></div>';
    return h + "</div>";
  }

  /* ---------- adatbetöltés ---------- */
  function betolt(lap) {
    if (S.betolt) return; S.betolt = true;
    var gomb = document.getElementById("frissit"); if (gomb) gomb.disabled = true;
    (API ? apiAdat(lap) : fajlAdat(lap)).then(function (d) {
      S.betolt = false;
      if (d && d.error === "auth") { FBR.lock(); return; }
      if (!d || d.error || !d.honapok) throw new Error((d && d.message) || "Hibás válasz");
      var lapValt = S.lap !== d.lap;
      S.data = d; S.lap = d.lap;
      if (lapValt || S.honap < 0 || S.honap >= d.honapok.length) S.honap = alapHonap(d.honapok);
      rajzol();
    }).catch(function (e) {
      S.betolt = false;
      if (S.data) { var st = document.getElementById("allapot"); if (st) st.textContent = "Nem sikerült frissíteni – a legutóbbi adatok látszanak."; return; }
      app.innerHTML = '<div class="notice"><h1>Nem sikerült betölteni</h1><p>' + esc(e.message || e) + '</p><p><button class="btn" id="ujra">Újrapróbálom</button></p></div>';
      document.getElementById("ujra").onclick = function () { betolt(S.lap); };
    });
  }

  function apiAdat(lap) {
    return fetch(API + "?adat=1&lap=" + encodeURIComponent(lap || "") + "&t=" + encodeURIComponent(FBR.token()) + "&_=" + Date.now()).then(function (r) { return r.json(); });
  }
  /** Titkosított fájlból: { lap, lapok, negyedevek: { lap: honapok }, frissitve } */
  function fajlAdat(lap) {
    return fetch("adat.enc.json?_=" + Date.now()).then(function (r) { if (!r.ok) throw new Error("Az adatfájl nem érhető el (" + r.status + ")."); return r.json(); }).then(function (f) {
      var t = FbrKripto.visszafejt(FBR.token(), f);
      if (!t) return { error: "auth" };
      var l = t.negyedevek[lap] ? lap : t.lap;
      return { lap: l, lapok: t.lapok, honapok: t.negyedevek[l], jutalmak: t.jutalmak, frissitve: t.frissitve };
    });
  }

  function alapHonap(hk) {
    var most = HONAPOK[new Date().getMonth()];
    for (var i = 0; i < hk.length; i++) if (String(hk[i].nev).toLowerCase() === most) return i;
    for (var j = hk.length - 1; j >= 0; j--) { var e = hk[j].osszes.egyseg; if (e && e.ossz) return j; }
    return 0;
  }

  /* ---------- megjelenítés ---------- */
  /** A rekord-adatokat tartalmazó hónap (ha több van, amelyikben a legtöbb az „eddig”). */
  function rekordHonap(d) {
    var rh = null;
    d.honapok.forEach(function (x) { var r = x.osszes.rekord; if (r && r.cel && (!rh || (r.eddig || 0) >= (rh.osszes.rekord.eddig || 0))) rh = x; });
    return rh;
  }

  function rajzol() {
    var d = S.data, rh = rekordHonap(d);
    var nezet = S.nezet === "havi" || S.nezet === "negyedev" ? S.nezet : (rh ? "rekord" : "negyedev");
    controls.innerHTML =
      '<div class="tabs" role="tablist" aria-label="Nézet">' +
        (rh ? '<button role="tab" data-n="rekord" aria-selected="' + (nezet === "rekord") + '">🏆 Év végi rekord</button>' : "") +
        '<button role="tab" data-n="negyedev" aria-selected="' + (nezet === "negyedev") + '">Negyedév</button>' +
        '<button role="tab" data-n="havi" aria-selected="' + (nezet === "havi") + '">Havi</button></div>' +
      (d.lapok && d.lapok.length > 1 ? '<select class="q" id="lap" aria-label="Negyedév">' + d.lapok.map(function (l) { return '<option' + (l === d.lap ? " selected" : "") + ">" + esc(l) + "</option>"; }).join("") + "</select>" : "") +
      (nezet === "havi" ? '<div class="tabs" role="tablist" aria-label="Hónap">' + d.honapok.map(function (m, i) {
        return '<button role="tab" data-i="' + i + '" aria-selected="' + (i === S.honap) + '">' + esc(m.nev) + "</button>";
      }).join("") + "</div>" : "");
    var sel = document.getElementById("lap"); if (sel) sel.onchange = function () { betolt(sel.value); };
    controls.querySelectorAll("[data-i]").forEach(function (b) { b.onclick = function () { S.honap = +b.dataset.i; rajzol(); }; });
    controls.querySelectorAll("[data-n]").forEach(function (b) { b.onclick = function () {
      S.nezet = b.dataset.n; try { localStorage.setItem("fbr_nezet", S.nezet); } catch (e) {} rajzol(); window.scrollTo(0, 0);
    }; });

    var frissitve = new Date(d.frissitve);
    function statusz(ido, vallalas) {
      return '<div class="status"><span id="allapot">Adatok: ' + frissitve.toLocaleString("hu-HU", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) + "</span>" +
        '<button id="frissit" type="button">↻ Frissítés</button>' +
        (ido != null && ido > 0 && ido < 1 ? '<span class="legend"><i></i> időarányos (' + szazalek(ido) + ")</span>" : "") +
        (vallalas ? '<span class="legend"><i class="v"></i> vállalás</span>' : "") + "</div>";
    }

    var html;
    if (nezet === "rekord") {
      var t = rekordIdo(rh.rekordCimke), rido = t ? clamp((Date.now() - t.tol) / (t.ig - t.tol)) : null;
      html = statusz(rido, false) + rekordKartya(rh, d.jutalmak);
      if (d.jutalmak && d.jutalmak.szintek) html += jutalmakSzekcio(rh, d.jutalmak);
      html += '<h2>Csapatok az év végi rekordban</h2><div class="grid teams">' + rh.csapatok.map(function (c) { return rekordCsapatKartya(c, rido); }).join("") + "</div>";
      html += '<div class="grid lower">' + rekordToplista(rh) + "</div>";
    } else if (nezet === "negyedev") {
      var q = negyedevAdat(d), qi = negyedevIdo(), qo = q.osszes;
      html = statusz(qi, true) + '<h2 class="elso">Negyedéves állás – ' + esc(d.lap) + "</h2>";
      html += '<div class="grid kpis2">' + kicsiKartya("Egység – vállaláshoz képest", { ossz: qo.egyseg.ossz, cel: qo.egyseg.vallalas }, qi, "ES", "ES") +
        kicsiKartya("Egység – célhoz képest", { ossz: qo.egyseg.ossz, cel: qo.egyseg.cel }, qi, "ES", "ES") + "</div>";
      html += '<div class="grid kpis">' + honapBontas(d) + kicsiKartya("Ügyfélidőpontok", qo.ugyfel, qi, "db") + kicsiKartya("Prezentációk", qo.prezi, qi, "db") + "</div>";
      html += '<h2>Csapatok a negyedévben</h2><div class="grid teams">' + q.csapatok.map(function (c) { return negyedevCsapatKartya(c, qi); }).join("") + "</div>";
      html += '<div class="grid lower">' + toplista(q, "egyseg", "Egység toplista – negyedév", "ES") + "</div>";
    } else {
      var h = d.honapok[S.honap];
      if (!h) { app.innerHTML = '<div class="notice"><h1>Nincs adat</h1><p>Ezen a lapon nem találtam havi blokkot.</p></div>'; return; }
      var ido = idoArany(h.nev), o = h.osszes;
      html = statusz(ido, true) + '<h2 class="elso">Havi eredmények – ' + esc(h.nev) + "</h2>";
      html += '<div class="grid kpis">' + egysegKartya(o.egyseg, ido) + kicsiKartya("Ügyfélidőpontok", o.ugyfel, ido, "db") + kicsiKartya("Prezentációk", o.prezi, ido, "db") + "</div>";
      html += '<h2>Csapatok</h2><div class="grid teams">' + h.csapatok.map(function (c) { return csapatKartya(c, ido, false); }).join("") + "</div>";
      html += '<div class="grid lower">' + toplista(h, "egyseg", "Egység toplista – " + esc(h.nev), "ES") + toplista(h, "ugyfel", "Ügyfélidőpont toplista – " + esc(h.nev), "db") + "</div>";
    }

    app.innerHTML = html;
    document.getElementById("frissit").onclick = function () { betolt(S.lap); };
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      app.querySelectorAll(".fill").forEach(function (f) { f.style.width = f.dataset.w + "%"; });
    }); });
  }

  /* ---------- negyedév ---------- */
  function plusz(a, b) { return a == null ? b : b == null ? a : a + b; }
  function ures() { return { egyseg: { ossz: null, vallalas: null, cel: null }, ugyfel: { ossz: null, cel: null }, prezi: { ossz: null, cel: null } }; }
  function hozzaad(acc, x) {
    ["egyseg", "ugyfel", "prezi"].forEach(function (m) {
      if (!x[m]) return;
      Object.keys(acc[m]).forEach(function (k) { acc[m][k] = plusz(acc[m][k], x[m][k]); });
    });
  }
  /** A negyedév összesítése: a havi blokkok összege, csapatonként és személyenként (név szerint). */
  function negyedevAdat(d) {
    var osszes = ures(), csapatok = {}, sorrend = [];
    d.honapok.forEach(function (h) { hozzaad(osszes, h.osszes); });
    d.honapok.slice().reverse().forEach(function (h) {
      h.csapatok.forEach(function (c) {
        if (!csapatok[c.nev]) { csapatok[c.nev] = { nev: c.nev, osszes: ures(), tagok: [], tagIdx: {} }; sorrend.push(c.nev); }
        var cs = csapatok[c.nev];
        hozzaad(cs.osszes, c.osszes);
        c.tagok.forEach(function (t) {
          if (!t.nev) return;
          var k = t.nev.trim();
          if (!(k in cs.tagIdx)) { cs.tagIdx[k] = cs.tagok.length; var u = ures(); u.nev = t.nev; u.poz = t.poz; u.szint = t.szint; u.vezeto = t.vezeto; cs.tagok.push(u); }
          hozzaad(cs.tagok[cs.tagIdx[k]], t);
        });
      });
    });
    return { osszes: osszes, csapatok: sorrend.map(function (n) { return csapatok[n]; }) };
  }
  function negyedevIdo() {
    var m = /(\d{4})\s*Q([1-4])/i.exec(S.lap || ""); if (!m) return null;
    var tol = new Date(+m[1], (+m[2] - 1) * 3, 1), ig = new Date(+m[1], (+m[2]) * 3, 1);
    return clamp((Date.now() - tol) / (ig - tol));
  }
  function honapBontas(d) {
    return '<section class="card reveal"><p class="k-label">Egység havonta</p><table class="hb"><thead><tr><th></th><th>Teljesítve</th><th>Vállalás</th><th>Cél</th></tr></thead><tbody>' +
      d.honapok.map(function (h) {
        var e = h.osszes.egyseg || {};
        return "<tr><th>" + esc(h.nev) + "</th><td><b>" + szam(e.ossz) + "</b></td><td>" + szam(e.vallalas) + " <span>" + szazalek(arany(e.ossz, e.vallalas)) + "</span></td><td>" + szam(e.cel) + " <span>" + szazalek(arany(e.ossz, e.cel)) + "</span></td></tr>";
      }).join("") + "</tbody></table></section>";
  }
  function negyedevCsapatKartya(c, ido) {
    var e = c.osszes.egyseg, pv = arany(e.ossz, e.vallalas), pc = arany(e.ossz, e.cel);
    var tagok = c.tagok.slice().sort(function (a, b) { return (b.egyseg.ossz || 0) - (a.egyseg.ossz || 0); });
    return '<section class="card reveal"><div class="team-h"><h3>' + esc(c.nev) + "</h3><span>" + szam(e.ossz) + " ES</span></div>" +
      '<div class="q-sor"><span>Vállalás</span>' + bar(e.ossz, e.vallalas, { ido: ido }) + "<span>" + szam(e.vallalas) + " · " + pctHtml(pv) + "</span></div>" +
      '<div class="q-sor"><span>Cél</span>' + bar(e.ossz, e.cel, { ido: ido }) + "<span>" + szam(e.cel) + " · " + pctHtml(pc) + "</span></div>" +
      '<ul class="members">' + tagok.map(function (t) {
        var te = t.egyseg, cel = te.cel || te.vallalas;
        var chips = (t.poz ? '<span class="chip' + (t.vezeto ? " lead" : "") + '">' + esc(t.poz) + "</span>" : "") + (t.szint ? '<span class="chip">' + esc(t.szint) + "</span>" : "");
        return '<li><div class="m-name"><b title="' + esc(t.nev) + '">' + esc(t.nev) + "</b>" + chips + "</div>" +
          '<div class="m-units">' + bar(te.ossz, cel, { vallalas: te.vallalas, ido: ido }) + '<div class="bar-row"><span>' + szam(te.ossz) + " / " + szam(te.cel) + " ES</span>" + pctHtml(arany(te.ossz, te.cel)) + "</div></div>" +
          '<div class="m-side"><div><b>' + szazalek(arany(te.ossz, te.vallalas)) + "</b>vállalás</div><div><b>" + szazalek(arany(te.ossz, te.cel)) + "</b>cél</div></div></li>";
      }).join("") + "</ul></section>";
  }

  function rekordCsapatKartya(c, ido) {
    var r = c.osszes.rekord || {}, p = arany(r.eddig, r.cel);
    var tagok = c.tagok.filter(function (t) { return t.nev && t.rekord && t.rekord.cel; });
    tagok.sort(function (a, b) { return (b.rekord.eddig || 0) - (a.rekord.eddig || 0); });
    return '<section class="card reveal"><div class="team-h"><h3>' + esc(c.nev) + "</h3>" + pctHtml(p) + "</div>" +
      bar(r.eddig, r.cel, { ido: ido }) +
      '<div class="bar-row"><span><b style="color:var(--ink)">' + szam(r.eddig) + "</b> / " + szam(r.cel) + " ES</span><span>még " + szam(Math.max(0, (r.cel || 0) - (r.eddig || 0))) + " ES</span></div>" +
      '<ul class="members">' + tagok.map(function (t) {
        var rk = t.rekord, tp = arany(rk.eddig, rk.cel);
        var chips = (t.poz ? '<span class="chip' + (t.vezeto ? " lead" : "") + '">' + esc(t.poz) + "</span>" : "") + (t.szint ? '<span class="chip">' + esc(t.szint) + "</span>" : "");
        return '<li class="r-tag"><div class="m-name"><b title="' + esc(t.nev) + '">' + esc(t.nev) + "</b>" + chips + "</div>" +
          '<div class="m-units">' + bar(rk.eddig, rk.cel, { ido: ido }) + '<div class="bar-row"><span>' + szam(rk.eddig) + " / " + szam(rk.cel) + " ES</span>" + pctHtml(tp) + "</div></div></li>";
      }).join("") + "</ul></section>";
  }

  function egysegKartya(e, ido) {
    if (!e) return "";
    var cel = e.cel || e.vallalas, p = arany(e.ossz, cel);
    var hetek = (e.hetek || []), max = Math.max.apply(null, hetek.map(function (x) { return x || 0; }).concat([1]));
    return '<section class="card reveal"><p class="k-label">Egység</p>' +
      '<div class="k-num">' + szam(e.ossz) + "<small>ES</small></div>" +
      '<p class="k-sub">Cél: <b>' + szam(e.cel) + " ES</b>" + (e.vallalas ? " · Vállalás: <b>" + szam(e.vallalas) + " ES</b>" : "") + " · " + pctHtml(p) + "</p>" +
      bar(e.ossz, cel, { big: true, vallalas: e.vallalas, vCimke: true, ido: ido }) +
      (hetek.length ? '<div class="weeks" style="--n:' + hetek.length + '">' + hetek.map(function (x) {
        return '<div class="' + (x ? "" : "zero") + '" style="height:' + Math.max(4, ((x || 0) / max) * 100) + '%"><span>' + (x ? szam(x) : "") + "</span></div>";
      }).join("") + '</div><div class="weeks-l" style="--n:' + hetek.length + '">' + hetek.map(function (_, i) { return "<span>" + (i + 1) + ". hét</span>"; }).join("") + "</div>" : "") +
      "</section>";
  }

  function kicsiKartya(cim, x, ido, egys, numEgys) {
    if (!x) return "";
    var p = arany(x.ossz, x.cel);
    return '<section class="card reveal"><p class="k-label">' + cim + "</p>" +
      '<div class="k-num">' + szam(x.ossz) + "<small>/ " + szam(x.cel) + (numEgys ? " " + numEgys : "") + "</small></div>" +
      '<p class="k-sub">' + pctHtml(p) + (x.cel && x.ossz != null && x.ossz < x.cel ? " · még <b>" + szam(x.cel - x.ossz) + " " + egys + "</b>" : (p != null && p >= 1 ? " · cél teljesítve 🎉" : "")) + "</p>" +
      bar(x.ossz, x.cel, { big: true, ido: ido }) + "</section>";
  }

  function rekordKartya(h, jut) {
    var r = h.osszes.rekord, t = rekordIdo(h.rekordCimke), p = arany(r.eddig, r.cel);
    var ido = null, hatra = null;
    if (t) {
      ido = clamp((Date.now() - t.tol) / (t.ig - t.tol));
      hatra = Math.max(0, Math.ceil((t.ig - Date.now()) / NAP));
    }
    var hiany = Math.max(0, (r.cel || 0) - (r.eddig || 0));
    var napi = hatra ? Math.ceil(hiany / hatra) : null;
    return '<section class="card rekord reveal"><div class="r-head"><p class="k-label">🏆 Év végi rekord' + (t ? " · " + esc(t.szoveg) : "") + "</p>" + pctHtml(p) + "</div>" +
      '<div class="r-num">' + szam(r.eddig) + "<small> / " + szam(r.cel) + " ES</small></div>" +
      '<div style="margin-top:16px">' + bar(r.eddig, r.cel, { big: true, ido: ido, jelek: jut && jut.szintek ? jut.szintek.map(function (x) { return { ertek: x.es }; }) : [] }) + "</div>" +
      '<div class="r-facts"><div><b>' + szam(hiany) + " ES</b><span>még hiányzik</span></div>" +
      "<div><b>" + (hatra == null ? "–" : hatra + " nap") + "</b><span>van hátra</span></div>" +
      "<div><b>" + (napi == null ? "–" : (hiany ? "~" + szam(napi) + " ES" : "Megvan! 🎉")) + "</b><span>" + (hiany ? "kell naponta" : "rekord teljesítve") + "</span></div></div></section>";
  }

  function jutalmakSzekcio(h, jut) {
    var eddig = h.osszes.rekord.eddig || 0, kovetkezo = null;
    jut.szintek.forEach(function (x) { if (kovetkezo == null && eddig < x.es) kovetkezo = x.es; });
    return '<h2>🎁 Jutalmak</h2><div class="grid jut">' + jut.szintek.map(function (x) {
      var ok = eddig >= x.es, kov = x.es === kovetkezo;
      return '<section class="card jut-szint reveal' + (ok ? " ok" : kov ? " kov" : "") + '"><div class="jut-h"><b>' + szam(x.es) + "<small> ES felett</small></b>" +
        '<span class="allapot">' + (ok ? "✓ Elérve" : "még " + szam(x.es - eddig) + " ES") + "</span></div>" +
        bar(eddig, x.es) +
        (x.tetelek || []).map(function (t) {
          return '<div class="jut-tetel"><div class="jut-ikon" aria-hidden="true">' + esc(t.ikon || "🎁") + "</div><div><b>" + esc(t.mit) + "</b><span>" + esc(t.ki) + "</span></div></div>";
        }).join("") + "</section>";
    }).join("") + "</div>";
  }

  function rekordToplista(h) {
    var lista = [];
    h.csapatok.forEach(function (c) { c.tagok.forEach(function (t) { if (t.nev && t.rekord && t.rekord.eddig) lista.push({ t: t, csapat: c.nev, ossz: t.rekord.eddig, cel: t.rekord.cel }); }); });
    lista.sort(function (a, b) { return b.ossz - a.ossz; });
    lista = lista.slice(0, 5);
    return '<section class="card reveal"><h2 style="margin-top:0">🏆 Egyéni toplista – év végi rekord</h2>' +
      (lista.length ? '<ol class="top">' + lista.map(function (x, i) {
        return '<li><div class="medal">' + (i + 1) + '</div><div class="t-name"><b>' + esc(x.t.nev) + "</b><span>" + esc(x.csapat) + "</span></div>" +
          '<div class="t-val"><b>' + szam(x.ossz) + " ES</b><span>" + szazalek(arany(x.ossz, x.cel)) + " a saját rekordcélból</span></div></li>";
      }).join("") + "</ol>" : '<p class="k-sub">Még nincs eredmény.</p>') + "</section>";
  }

  function csapatKartya(c, ido, rekord) {
    var e = c.osszes.egyseg || {}, cel = e.cel || e.vallalas, p = arany(e.ossz, cel);
    var u = c.osszes.ugyfel || {}, pr = c.osszes.prezi || {}, rk = c.osszes.rekord;
    var tagok = c.tagok.filter(function (t) { return t.nev; });
    return '<section class="card reveal"><div class="team-h"><h3>' + esc(c.nev) + "</h3>" + pctHtml(p) + "</div>" +
      bar(e.ossz, cel, { vallalas: e.vallalas, ido: ido }) +
      '<div class="team-mini"><div><b>' + szam(e.ossz) + " / " + szam(cel) + "</b>egység (ES)</div>" +
      "<div><b>" + szam(u.ossz) + " / " + szam(u.cel) + "</b>ügyfélidőpont</div>" +
      (rekord && rk && rk.cel ? "<div><b>" + szam(rk.eddig) + " / " + szam(rk.cel) + "</b>rekordcél</div>" : "<div><b>" + szam(pr.ossz) + " / " + szam(pr.cel) + "</b>prezi</div>") + "</div>" +
      '<ul class="members">' + tagok.map(function (t) { return tagSor(t, ido, rekord); }).join("") + "</ul></section>";
  }

  function tagSor(t, ido, rekord) {
    var e = t.egyseg || {}, cel = e.cel || e.vallalas, p = arany(e.ossz, cel), u = t.ugyfel || {}, rk = t.rekord;
    var chips = (t.poz ? '<span class="chip' + (t.vezeto ? " lead" : "") + '">' + esc(t.poz) + "</span>" : "") + (t.szint ? '<span class="chip">' + esc(t.szint) + "</span>" : "");
    return '<li><div class="m-name"><b title="' + esc(t.nev) + '">' + esc(t.nev) + "</b>" + chips + "</div>" +
      '<div class="m-units">' + bar(e.ossz, cel, { vallalas: e.vallalas, ido: ido }) +
      '<div class="bar-row"><span>' + szam(e.ossz) + " / " + szam(cel) + " ES</span>" + pctHtml(p) + "</div></div>" +
      '<div class="m-side"><div><b>' + szam(u.ossz) + "/" + szam(u.cel) + "</b>ügyfél</div>" +
      (rekord && rk && rk.cel ? "<div><b>" + szazalek(arany(rk.eddig, rk.cel)) + "</b>rekord</div>" : "") + "</div></li>";
  }

  function toplista(h, mezo, cim, egys) {
    var lista = [];
    h.csapatok.forEach(function (c) { c.tagok.forEach(function (t) {
      var x = t[mezo]; if (t.nev && x && x.ossz) lista.push({ t: t, csapat: c.nev, ossz: x.ossz, cel: mezo === "egyseg" ? (x.cel || x.vallalas) : x.cel });
    }); });
    lista.sort(function (a, b) { return b.ossz - a.ossz; });
    lista = lista.slice(0, 5);
    return '<section class="card reveal"><h2 style="margin-top:0">' + cim + "</h2>" +
      (lista.length ? '<ol class="top">' + lista.map(function (x, i) {
        return '<li><div class="medal">' + (i + 1) + '</div><div class="t-name"><b>' + esc(x.t.nev) + "</b><span>" + esc(x.csapat) + "</span></div>" +
          '<div class="t-val"><b>' + szam(x.ossz) + " " + egys + "</b><span>" + szazalek(arany(x.ossz, x.cel)) + " a célból</span></div></li>";
      }).join("") + "</ol>" : '<p class="k-sub">Ebben a hónapban még nincs eredmény.</p>') + "</section>";
  }

  /* ---------- indítás ---------- */
  if (!FBR.token()) return; // belépésre vár
  document.getElementById("kilep").onclick = function () { FBR.lock(); };
  betolt("");
  // 5 percenként frissít, ha az oldal látható
  setInterval(function () { if (!document.hidden) betolt(S.lap); }, 5 * 60 * 1000);
  var utolso = Date.now();
  document.addEventListener("visibilitychange", function () { if (!document.hidden && Date.now() - utolso > 2 * 60 * 1000) { utolso = Date.now(); betolt(S.lap); } });
})();
</script>
</body>
</html>
